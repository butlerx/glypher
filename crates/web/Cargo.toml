[package]
name                   = "web"
version                = "0.1.0"
authors.workspace      = true
edition.workspace      = true
rust-version.workspace = true
description            = "Wasm frontend for glypher, converts images to ascii art in the browser"
readme                 = "README.md"
homepage.workspace     = true
repository.workspace   = true
license.workspace      = true
keywords               = ["ascii", "ascii-art", "image", "leptos", "wasm"]
categories             = ["multimedia::images", "wasm"]
# Deployed as static files by trunk, not published to crates.io.
publish                = false

[dependencies]
console_error_panic_hook = "0.1"
gloo-file                = { version = "0.4", features = ["futures"] }
gloo-net                 = { version = "0.7", features = ["http"] }
glypher.workspace        = true
js-sys                   = "0.3"
leptos                   = { version = "0.8", features = ["csr"] }
wasm-bindgen             = "0.2"
wasm-bindgen-futures     = "0.4"

[dependencies.web-sys]
version  = "0.3"
features = [
  "Blob",
  "BlobPropertyBag",
  "Clipboard",
  "DataTransfer",
  "DragEvent",
  "HtmlAnchorElement",
  "HtmlInputElement",
  "Navigator",
  "Url",
]
