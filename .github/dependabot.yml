version: 2
updates:
  - package-ecosystem: 'cargo'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      leptos-stack:
        patterns:
          - 'leptos'
          - 'gloo-*'
          - 'wasm-bindgen*'
          - 'js-sys'
          - 'web-sys'
      cli-tools:
        patterns:
          - 'clap'
          - 'ureq'
      error-handling:
        patterns:
          - 'thiserror'
    open-pull-requests-limit: 10
    commit-message:
      prefix: 'deps'
      include: 'scope'
    cooldown:
      default-days: 7

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      github-pages:
        patterns:
          - 'actions/configure-pages'
          - 'actions/upload-pages-artifact'
          - 'actions/deploy-pages'
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
