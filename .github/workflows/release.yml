name: Release
on:
  push:
    branches:
      - 'main'
env:
  CARGO_TERM_COLOR: always
permissions:
  contents: write
  pull-requests: write
jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    # This is a two-package manifest, so release-please reports per path:
    # `release_created` is only set for a root (".") package.
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      lib_released: ${{ steps.release.outputs['crates/glypher--release_created'] }}
      cli_released: ${{ steps.release.outputs['crates/cli--release_created'] }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ github.token }}
  publish:
    runs-on: ubuntu-latest
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # v1
        with:
          toolchain: stable
      - run: cargo test --workspace --locked
      - name: Authenticate with crates.io
        id: crates_io_auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      # Publish only the crates release-please just released. cargo orders a
      # multi-package publish by dependency, so the library lands before the CLI.
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates_io_auth.outputs.token }}
          LIB_RELEASED: ${{ needs.release-please.outputs.lib_released }}
          CLI_RELEASED: ${{ needs.release-please.outputs.cli_released }}
        run: |-
          pkgs=()
          if [ "$LIB_RELEASED" = true ]; then pkgs+=(-p glypher); fi
          if [ "$CLI_RELEASED" = true ]; then pkgs+=(-p glypher-cli); fi
          cargo publish "${pkgs[@]}" --locked
